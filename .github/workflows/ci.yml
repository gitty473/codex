name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke-test wheel in an isolated environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/codex-wheel-test"
          "$RUNNER_TEMP/codex-wheel-test/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/codex-wheel-test/bin/codex-starter" --name CI)" = "Hallo, CI!"
          test "$("$RUNNER_TEMP/codex-wheel-test/bin/python" -m codex_starter --name CI)" = "Hallo, CI!"
